name: Standalone tests and versioned release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit zip

      - name: Run standalone tests
        run: make test

      - name: Build installable mod ZIP
        run: make package

      - name: Verify versioned package
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          test -s "dist/gen1recomp_dscrete_items-${VERSION}.zip"

      - name: Publish new manifest version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          TAG="v${VERSION}"
          ASSET="dist/gen1recomp_dscrete_items-${VERSION}.zip"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "${TAG} is already released; ordinary commits do not create another release."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" "${ASSET}" \
              --title "DScrete Items ${TAG}" \
              --generate-notes
          else
            gh release create "${TAG}" "${ASSET}" \
              --target "${GITHUB_SHA}" \
              --title "DScrete Items ${TAG}" \
              --generate-notes
          fi
