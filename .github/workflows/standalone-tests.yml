name: Standalone tests and package

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit zip

      - name: Run standalone tests
        run: make test

      - name: Build testable mod ZIP
        run: make package

      - name: Publish rolling dev prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev "${GITHUB_SHA}"
          git push origin refs/tags/dev --force
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev \
              --title "Development Build" \
              --notes "Latest automatic build from main. This is a prerelease for testing and may be unstable." \
              --prerelease
          else
            gh release create dev \
              --title "Development Build" \
              --notes "Latest automatic build from main. This is a prerelease for testing and may be unstable." \
              --prerelease
          fi
          gh release upload dev dist/dscrete-items-dev.zip --clobber
